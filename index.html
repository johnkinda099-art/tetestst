<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Спальня — 360° тур</title>
<style>
:root{--bg:#1d1814;--fg:#fff;--chip:rgba(30,24,18,.55);--chip-b:rgba(255,255,255,.25)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#1d1814;--fg:#fff;--chip:rgba(30,24,18,.55);--chip-b:rgba(255,255,255,.25)}}
:root[data-theme="dark"]{--bg:#1d1814}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#v{position:fixed;inset:0;cursor:grab;touch-action:none}
#v.drag{cursor:grabbing}
canvas{display:block;width:100%;height:100%}
.bar{position:fixed;left:0;right:0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px;pointer-events:none}
.top{top:env(safe-area-inset-top,0px)}
.bot{bottom:env(safe-area-inset-bottom,0px)}
.chip,button{pointer-events:auto;background:var(--chip);color:var(--fg);border:1px solid var(--chip-b);border-radius:999px;padding:8px 14px;font-size:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
button{cursor:pointer;font-family:inherit}
button:hover,button.on{background:rgba(255,255,255,.28)}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);font-size:16px;transition:opacity .5s}
#load.hide{opacity:0;pointer-events:none}
</style>
</head>
<body>
<div id="v"></div>
<div class="bar top"><span class="chip">Тягніть мишкою, щоб оглянути кімнату · колесо — зум</span></div>
<div class="bar bot">
  <button id="auto" class="on">Автообертання</button>
  <button id="zin">＋</button>
  <button id="zout">－</button>
  <button id="reset">Скинути</button>
  <button id="fs">На весь екран</button>
</div>
<div id="load">Завантаження кімнати…</div>

  function resize(){var w=box.clientWidth,h=box.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();}
  window.addEventListener('resize',resize);resize();

  var ptrs={},last=null,pinch=0;
  function stopAuto(){autoRot=false;document.getElementById('auto').classList.remove('on');}
  box.addEventListener('pointerdown',function(e){box.setPointerCapture(e.pointerId);ptrs[e.pointerId]=e;last={x:e.clientX,y:e.clientY};box.classList.add('drag');stopAuto();});
  box.addEventListener('pointermove',function(e){
    if(!ptrs[e.pointerId])return; ptrs[e.pointerId]=e;
    var ids=Object.keys(ptrs);
    if(ids.length===2){
      var a=ptrs[ids[0]],b=ptrs[ids[1]],d=Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
      if(pinch)setFov(fov-(d-pinch)*0.2); pinch=d; return;
    }
    var k=0.15*(fov/75);
    lon-=(e.clientX-last.x)*k; lat+=(e.clientY-last.y)*k;
    lat=Math.max(-85,Math.min(85,lat)); last={x:e.clientX,y:e.clientY};
  });
  function up(e){delete ptrs[e.pointerId];pinch=0;if(!Object.keys(ptrs).length)box.classList.remove('drag');
    var r=Object.keys(ptrs);if(r.length===1){last={x:ptrs[r[0]].clientX,y:ptrs[r[0]].clientY};}}
  box.addEventListener('pointerup',up);box.addEventListener('pointercancel',up);
  function setFov(v){fov=Math.max(35,Math.min(100,v));camera.fov=fov;camera.updateProjectionMatrix();}
  box.addEventListener('wheel',function(e){e.preventDefault();setFov(fov+e.deltaY*0.05);},{passive:false});

  document.getElementById('auto').onclick=function(){autoRot=!autoRot;this.classList.toggle('on',autoRot);};
  document.getElementById('zin').onclick=function(){setFov(fov-8);};
  document.getElementById('zout').onclick=function(){setFov(fov+8);};
  document.getElementById('reset').onclick=function(){lon=0;lat=0;setFov(75);};
  document.getElementById('fs').onclick=function(){
    try{ if(document.fullscreenElement)document.exitFullscreen(); else document.documentElement.requestFullscreen(); }catch(err){}
  };
  window.addEventListener('keydown',function(e){
    stopAuto();
    if(e.key==='ArrowLeft')lon-=4; if(e.key==='ArrowRight')lon+=4;
    if(e.key==='ArrowUp')lat=Math.min(85,lat+4); if(e.key==='ArrowDown')lat=Math.max(-85,lat-4);
    if(e.key==='+'||e.key==='=')setFov(fov-6); if(e.key==='-')setFov(fov+6);
  });

  (function loop(){
    requestAnimationFrame(loop);
    if(autoRot)lon+=0.06;
    var phi=THREE.MathUtils.degToRad(90-lat),th=THREE.MathUtils.degToRad(lon);
    camera.lookAt(500*Math.sin(phi)*Math.cos(th),500*Math.cos(phi),500*Math.sin(phi)*Math.sin(th));
    renderer.render(scene,camera);
  })();
})();
</script>
